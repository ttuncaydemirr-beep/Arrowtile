<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Arrowtile simge adayı (1.2.1, "Kum ve Mürekkep"): uyarlanabilir simge ÖN PLAN katmanı, 108 dp = 432 px, saydam.
       Önemli öğeler 66 dp güvenli dairede (merkez 216, yarıçap 132). Renkler: kum tahta #FBF9F5 / kenar #D8D0C3 / hücre #EEE8DE,
       turkuaz ok #1F8A8A, kiremit ok #E0703C (game/js/theme.js ile aynı). -->
  <g transform="translate(216 216) scale(0.80) translate(-256 -256)">
    <!-- tahta: alt kalınlık + yüz -->
    <rect x="140" y="154" width="232" height="232" rx="44" fill="#D8D0C3"/>
    <rect x="140" y="140" width="232" height="232" rx="44" fill="#FBF9F5"/>
    <g fill="#EEE8DE">
      <rect x="160" y="160" width="92" height="92" rx="18"/>
      <rect x="260" y="160" width="92" height="92" rx="18"/>
      <rect x="160" y="260" width="92" height="92" rx="18"/>
      <rect x="260" y="260" width="92" height="92" rx="18"/>
    </g>
    <!-- yukarı bakan turkuaz ok (sol sütun, 2 hücre) -->
    <path transform="translate(0,8)" fill="#135757" d="M190 340 L190 236 L170 236 Q164 236 168 230 L201 186 Q206 180 211 186 L244 230 Q248 236 242 236 L222 236 L222 340 Q222 346 216 346 L196 346 Q190 346 190 340 Z"/>
    <path fill="#1F8A8A" d="M190 340 L190 236 L170 236 Q164 236 168 230 L201 186 Q206 180 211 186 L244 230 Q248 236 242 236 L222 236 L222 340 Q222 346 216 346 L196 346 Q190 346 190 340 Z"/>
    <circle cx="206" cy="218" r="6" fill="#fff" opacity=".8"/>
    <g transform="translate(-14,0)">
      <!-- sağa kaçan kiremit ok: tahtadan dışarı taşıyor (hareket izi) -->
      <g opacity=".45" fill="#E0703C">
        <rect x="262" y="296" width="14" height="24" rx="7"/>
        <rect x="286" y="296" width="14" height="24" rx="7"/>
      </g>
      <path transform="translate(0,8)" fill="#8E4522" d="M312 290 L362 290 L362 266 Q362 259 368 263 L414 302 Q419 308 414 314 L368 353 Q362 357 362 350 L362 326 L312 326 Q306 326 306 320 L306 296 Q306 290 312 290 Z"/>
      <path fill="#E0703C" d="M312 290 L362 290 L362 266 Q362 259 368 263 L414 302 Q419 308 414 314 L368 353 Q362 357 362 350 L362 326 L312 326 Q306 326 306 320 L306 296 Q306 290 312 290 Z"/>
      <circle cx="380" cy="308" r="6" fill="#fff" opacity=".85"/>
    </g>
  </g>
</svg>
