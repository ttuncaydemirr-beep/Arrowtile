name: arrowtile
description: "Arrowtile — süre yok, internetsiz ok bulmacası. (Flutter sürümü; web referansı: game/)"
publish_to: "none"

# versionName 1.2.0, versionCode 11 (build numarası). Play'e her yüklemede "+N" kısmını 1 artırın.
version: 1.2.0+11

environment:
  sdk: ">=3.10.0 <4.0.0" # google_mobile_ads 9.x: Dart >=3.10 / Flutter >=3.38.1; önerilen: Flutter stable >= 3.41
  flutter: ">=3.38.1"

# Sürümler docs/11-flutter-tasima.md sonundaki "Bağımlılıklar" tablosunda kaynakla gösterilmiştir.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # flutter_localizations hangi sürümü sabitliyorsa o kullanılır
  shared_preferences: ^2.5.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ">=0.4.0 <1.0.0" # GooglePlayPurchaseDetails.billingClientPurchase (bekleyen satın alma ayrımı)
  audioplayers: ^6.5.0
  vibration: ^3.1.0
  url_launcher: ^6.3.0
  # Analiz + çökme raporu (docs/19). Yalnızca lib/services/firebase_telemetry.dart kullanır; yapılandırma yoksa uygulama
  # bunlar olmadan çalışır. Android yapılandırması google-services.json'dır (depoda YOK; release.yml GitHub secret'tan yazar).
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true # lib/l10n/*.arb → flutter gen-l10n (l10n.yaml)
  uses-material-design: true
  assets:
    - lib/data/levels.json
    - assets/sfx/
    - assets/images/
    - assets/fonts/OFL.txt
  # 1.2.0 (docs/24 §7.4): Readex Pro (SIL OFL 1.1) — Latin (tr/en/de) + Arapça tek aile; sabit ağırlıklar tools/flutter/make-fonts.py ile
  # game/assets/fonts/ReadexPro-VF.ttf'ten üretildi. Lisans: assets/fonts/OFL.txt (main.dart → LicenseRegistry).
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
