<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Button</title><style>html,body{margin:0}</style></head>
<body class="at-root">
<div class="at-pad">
<div class="at-col" style="max-width:380px">
<button class="at-btn primary big block">Devam: Seviye 110</button>
<div class="at-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<button class="at-btn secondary"><span class="at-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6l6-2.5 6 2.5 6-2.5v14.5L15 20.5 9 18l-6 2.5z"/><path d="M9 3.5V18M15 6v14.5"/></svg></span>Harita</button><button class="at-btn secondary"><span class="at-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 8h15l-1.2 12.5H5.7z"/><path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10"/></svg></span>Mağaza</button></div>
<button class="at-btn secondary lead block"><span class="at-ic"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2.5" fill="var(--danger)"/><rect x="2" y="7" width="20" height="4.5" rx="1.8" fill="var(--danger)"/><path d="M12 7v14" stroke="var(--star)" stroke-width="3"/><path d="M2 9.2h20" stroke="#000" stroke-opacity=".12" stroke-width="1"/><path d="M12 7c-1.5-3.5-5.5-4-5.5-1.5S10 7 12 7zm0 0c1.5-3.5 5.5-4 5.5-1.5S14 7 12 7z" fill="none" stroke="var(--star)" stroke-width="2"/></svg></span><span class="at-txt">Günlük ödül<small class="ok">Ödülün hazır!</small></span><span class="at-dot" aria-label="Yeni"></span></button>
<div class="at-row"><button class="at-btn primary">Kaydet</button><button class="at-btn danger">İlerlemeyi sil</button><button class="at-btn equipped">Kuşanıldı</button><button class="at-btn ghost"><span class="at-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5l1.6 2.6 3-.6.7 3 2.6 1.6-1.4 2.9 1.4 2.9-2.6 1.6-.7 3-3-.6L12 21.5l-1.6-2.6-3 .6-.7-3-2.6-1.6L5.5 12 4.1 9.1l2.6-1.6.7-3 3 .6z"/></svg></span>Ayarlar</button><button class="at-btn tiny">Atla</button><button class="at-btn primary" disabled>Yetersiz jeton</button></div></div>
</div>

</body>
</html>
