<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Tabs</title><style>html,body{margin:0}</style></head>
<body class="at-root">
<div class="at-pad">
<div class="at-col" style="max-width:380px">
<div class="at-tabs" role="tablist"><button class="at-tab on" role="tab" aria-selected="true">Ok temaları</button><button class="at-tab" role="tab">Jeton</button></div>
<div class="at-seg" role="radiogroup"><button class="at-seg-btn" role="radio">Otomatik</button><button class="at-seg-btn on" role="radio" aria-checked="true">Açık</button><button class="at-seg-btn" role="radio">Koyu</button></div>
<div class="at-seg two" role="radiogroup"><button class="at-seg-btn on" role="radio" aria-checked="true"><span style="display:inline-flex;flex-direction:column;gap:3px"><i style="display:block;width:22px;height:4px;border-radius:2px;background:var(--arrow-emaye-1)"></i><i style="display:block;width:22px;height:4px;border-radius:2px;background:var(--arrow-emaye-2)"></i><i style="display:block;width:22px;height:4px;border-radius:2px;background:var(--arrow-emaye-3)"></i></span>Renkli</button><button class="at-seg-btn" role="radio"><span style="display:inline-flex;flex-direction:column;gap:5px"><i style="display:block;width:22px;height:2px;background:var(--ink)"></i><i style="display:block;width:22px;height:2px;background:var(--ink)"></i><i style="display:block;width:22px;height:2px;background:var(--ink)"></i></span>Tek renk</button></div></div>
</div>

</body>
</html>
