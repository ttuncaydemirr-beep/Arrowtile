<!-- @dsCard height=288 -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Arrowtile</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); } .ink { fill:var(--ink); } .tile { fill:var(--arrow-emaye-2); }
  .board { fill:var(--board); } .edge { fill:var(--edge); } .dot { fill:var(--cell-dot); }
  .blk { rx:var(--radius-btn); } .tray { rx:var(--radius-card); }
  .ar { fill:none; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
  .a1 { stroke:var(--arrow-emaye-1); } .h1 { fill:var(--arrow-emaye-1); }
  .a3 { stroke:var(--arrow-emaye-3); } .h3 { fill:var(--arrow-emaye-3); }
  .a4 { stroke:var(--arrow-emaye-4); } .h4 { fill:var(--arrow-emaye-4); }
  .a5 { stroke:var(--arrow-emaye-5); } .h5 { fill:var(--arrow-emaye-5); }
  .words { position:absolute; left:40px; bottom:40px; max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:12px 0 0 2px; font-size:14px; line-height:20px; font-weight:600; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 96×212 bled off the top (the one UI hue) · board tray 320×208 on its 8px edge (the "paper slab") · ink 60×140 bled off the right · arrow-emaye-2 96×56 (tile-red) — ≈45% of 960×288
  arrangement one tall accent slab with the tray beside it, satellites below and off the right edge, gutters space-16
  pattern     the literal motif — arrows on a corner-dot grid, from "Zemin sade, kahraman oklar": four Emaye arrows at 40px cell pitch, body 0.15·cell (6px), heads 0.40·cell, cell-dot grid dots
  scales      gutters space-16; tray rx radius-card, blocks rx radius-btn; dot pitch 40 = one board cell; edge offset raise-6+2
-->
<rect class="accent blk" x="0" y="-20" width="96" height="212" rx="14"/>
<rect class="tile blk" x="0" y="208" width="96" height="56" rx="14"/>
<rect class="edge tray" x="112" y="40" width="320" height="208" rx="18"/>
<rect class="board tray" x="112" y="32" width="320" height="208" rx="18"/>
<rect class="ink blk" x="448" y="120" width="60" height="140" rx="14"/>
<g class="dot">
<circle cx="132" cy="52" r="1.8"/><circle cx="172" cy="52" r="1.8"/><circle cx="212" cy="52" r="1.8"/><circle cx="252" cy="52" r="1.8"/><circle cx="292" cy="52" r="1.8"/><circle cx="332" cy="52" r="1.8"/><circle cx="372" cy="52" r="1.8"/><circle cx="412" cy="52" r="1.8"/>
<circle cx="132" cy="92" r="1.8"/><circle cx="172" cy="92" r="1.8"/><circle cx="212" cy="92" r="1.8"/><circle cx="252" cy="92" r="1.8"/><circle cx="292" cy="92" r="1.8"/><circle cx="332" cy="92" r="1.8"/><circle cx="372" cy="92" r="1.8"/><circle cx="412" cy="92" r="1.8"/>
<circle cx="132" cy="132" r="1.8"/><circle cx="172" cy="132" r="1.8"/><circle cx="212" cy="132" r="1.8"/><circle cx="252" cy="132" r="1.8"/><circle cx="292" cy="132" r="1.8"/><circle cx="332" cy="132" r="1.8"/><circle cx="372" cy="132" r="1.8"/><circle cx="412" cy="132" r="1.8"/>
<circle cx="132" cy="172" r="1.8"/><circle cx="172" cy="172" r="1.8"/><circle cx="212" cy="172" r="1.8"/><circle cx="252" cy="172" r="1.8"/><circle cx="292" cy="172" r="1.8"/><circle cx="332" cy="172" r="1.8"/><circle cx="372" cy="172" r="1.8"/><circle cx="412" cy="172" r="1.8"/>
<circle cx="132" cy="212" r="1.8"/><circle cx="172" cy="212" r="1.8"/><circle cx="212" cy="212" r="1.8"/><circle cx="252" cy="212" r="1.8"/><circle cx="292" cy="212" r="1.8"/><circle cx="332" cy="212" r="1.8"/><circle cx="372" cy="212" r="1.8"/><circle cx="412" cy="212" r="1.8"/>
</g>
<path class="ar a1" d="M137 72 H232 V113"/><polygon class="h1" points="224,113 240,113 232,127"/>
<path class="ar a4" d="M312 207 V111"/><polygon class="h4" points="304,111 320,111 312,97"/>
<path class="ar a3" d="M337 152 H393"/><polygon class="h3" points="393,144 393,160 407,152"/>
<path class="ar a5" d="M137 192 H192 V151"/><polygon class="h5" points="184,151 200,151 192,137"/>
</svg>
</div>
<div class="words">
<h1 class="name">Arrowtile</h1>
<p class="tag">Kum ve Mürekkep: sakin zemin, kahraman oklar.</p>
</div>
</div>
</body>
</html>
