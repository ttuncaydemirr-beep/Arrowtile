# 1.2.3 (docs/29): bağımlılık güncellemeleri haftalık PR olarak gelir; main'e otomatik birleşmez.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 1.2.4: yeni çıkan sürümler 7 gün bekletilir (bozuk/kötü niyetli sürüm riskine karşı).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
  - package-ecosystem: pub
    directory: /flutter/arrowtile
    schedule:
      interval: weekly
    # 1.2.4: yeni çıkan sürümler 7 gün bekletilir (bozuk/kötü niyetli sürüm riskine karşı).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
