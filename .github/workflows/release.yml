name: Release AAB (imzalı)

# Yalnızca elle çalışır. Play Store'a yüklenecek imzalı AAB üretir.
# Gerekli GitHub secrets (Ayarlar > Secrets and variables > Actions): docs/14-ci-imzali-derleme.md
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   ADMOB_APP_ID, ADMOB_INTERSTITIAL_ID, ADMOB_REWARDED_ID, ADMOB_BANNER_ID
#   GOOGLE_SERVICES_JSON  (Firebase google-services.json dosyasının TÜM içeriği; docs/14 §3 ve docs/19)
# Hiçbiri yoksa derleme bilerek durur: release'te test kimliğiyle/debug anahtarıyla paket üretilmez.
#
# İSTEĞE BAĞLI (10. secret): PLAY_SERVICE_ACCOUNT_JSON  (Play servis hesabı anahtarı; docs/25-play-otomatik-yukleme.md)
# Tanımlıysa ve `track` != none ise imzalı AAB, derlemeden sonra doğrudan Google Play'e yüklenir.
# Tanımlı değilse yükleme atlanır (::warning::), AAB yine artifact olarak üretilir (eski davranış).

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play'e yükleme kanalı (none = yükleme yok, yalnızca AAB artifact)"
        type: choice
        options:
          - none
          - internal
          - alpha
          - internal+alpha
        default: internal+alpha
      status:
        description: "Sürüm durumu: completed = yayına hazır sürüm oluşur; draft = taslak (Play Console'da elle tamamlanır)"
        type: choice
        options:
          - completed
          - draft
        default: completed
      hold_for_review:
        description: "alpha için: değişiklikleri otomatik incelemeye GÖNDERME (Publishing overview'da 'Send for review' ile siz gönderirsiniz)"
        type: boolean
        default: true
      release_notes_tr:
        description: "Sürüm notu TR (boşsa flutter/arrowtile/release-notes/tr.txt; en çok 500 karakter; satır sonu için \\n)"
        type: string
        required: false
        default: ""
      release_notes_en:
        description: "Sürüm notu EN (boşsa release-notes/en.txt; en çok 500 karakter)"
        type: string
        required: false
        default: ""
      release_notes_de:
        description: "Sürüm notu DE (boşsa release-notes/de.txt; en çok 500 karakter)"
        type: string
        required: false
        default: ""
      release_notes_ar:
        description: "Sürüm notu AR (boşsa release-notes/ar.txt; en çok 500 karakter)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  aab:
    name: İmzalı AAB derle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/arrowtile
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Secrets denetimi
        working-directory: ${{ github.workspace }}
        run: |
          missing=""
          for n in KS_B64:ANDROID_KEYSTORE_BASE64 KS_PASS:ANDROID_KEYSTORE_PASSWORD KEY_ALIAS:ANDROID_KEY_ALIAS KEY_PASS:ANDROID_KEY_PASSWORD \
                   ADMOB_APP_ID:ADMOB_APP_ID ADMOB_INTERSTITIAL_ID:ADMOB_INTERSTITIAL_ID ADMOB_REWARDED_ID:ADMOB_REWARDED_ID ADMOB_BANNER_ID:ADMOB_BANNER_ID \
                   GOOGLE_SERVICES_JSON:GOOGLE_SERVICES_JSON; do
            var="${n%%:*}"; secret="${n##*:}"
            if [ -z "${!var}" ]; then missing="$missing $secret"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Eksik secret::Şu GitHub secrets tanımlı değil:$missing. Adımlar: docs/14-ci-imzali-derleme.md. Release derlemesi test kimliği ya da debug anahtarıyla üretilmez, bu yüzden duruyor."
            exit 1
          fi
          # Biçim denetimi (değerleri günlüğe yazmaz)
          case "$ADMOB_APP_ID" in ca-app-pub-[0-9]*~[0-9]*) ;; *) echo "::error::ADMOB_APP_ID biçimi ca-app-pub-XXXX~YYYY olmalı (~ içerir)."; exit 1;; esac
          case "$ADMOB_INTERSTITIAL_ID" in ca-app-pub-[0-9]*/[0-9]*) ;; *) echo "::error::ADMOB_INTERSTITIAL_ID biçimi ca-app-pub-XXXX/YYYY olmalı (/ içerir)."; exit 1;; esac
          case "$ADMOB_REWARDED_ID" in ca-app-pub-[0-9]*/[0-9]*) ;; *) echo "::error::ADMOB_REWARDED_ID biçimi ca-app-pub-XXXX/YYYY olmalı (/ içerir)."; exit 1;; esac
          case "$ADMOB_BANNER_ID" in ca-app-pub-[0-9]*/[0-9]*) ;; *) echo "::error::ADMOB_BANNER_ID biçimi ca-app-pub-XXXX/YYYY olmalı (/ içerir)."; exit 1;; esac
          # 1.1.4 (docs/21): banner görünmüyor bildirimi — üç birim birbirinden FARKLI olmalı ve uygulama kimliğiyle aynı yayıncıya ait
          # olmalı (karışmış secret, ör. banner yerine geçiş birimi, banner'ın hiç dolmamasına yol açar). Değerler günlüğe yazılmaz.
          if [ "$ADMOB_BANNER_ID" = "$ADMOB_INTERSTITIAL_ID" ] || [ "$ADMOB_BANNER_ID" = "$ADMOB_REWARDED_ID" ] || [ "$ADMOB_INTERSTITIAL_ID" = "$ADMOB_REWARDED_ID" ]; then
            echo "::error::ADMOB_*_ID secret'larından ikisi aynı. Her biçim (geçiş, ödüllü, banner) için AdMob'da ayrı birim oluşturun."; exit 1
          fi
          PUB="${ADMOB_APP_ID%%~*}"
          for v in "$ADMOB_INTERSTITIAL_ID" "$ADMOB_REWARDED_ID" "$ADMOB_BANNER_ID"; do
            case "$v" in "$PUB"/*) ;; *) echo "::error::Bir reklam birimi ADMOB_APP_ID ile aynı yayıncı kimliğine (ca-app-pub-XXXX) sahip değil."; exit 1;; esac
          done
          for v in "$ADMOB_APP_ID" "$ADMOB_INTERSTITIAL_ID" "$ADMOB_REWARDED_ID" "$ADMOB_BANNER_ID"; do
            case "$v" in ca-app-pub-3940256099942544*) echo "::error::Google TEST kimliği verilmiş (3940256099942544). Kendi AdMob kimliğinizi girin."; exit 1;; esac
          done
          # Firebase yapılandırması: geçerli JSON ve paket adı com.arrowtile.puzzle olmalı (değeri günlüğe yazmaz)
          printf '%s' "$GOOGLE_SERVICES_JSON" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("::error title=GOOGLE_SERVICES_JSON geçersiz::GOOGLE_SERVICES_JSON geçerli bir JSON değil. Firebase konsolundan indirdiğiniz google-services.json dosyasının TÜM içeriğini ({ ile başlayıp } ile biten) olduğu gibi yapıştırın. Adımlar: docs/14-ci-imzali-derleme.md §3.")
              sys.exit(1)
          pk = []
          try:
              pk = [c["client_info"]["android_client_info"]["package_name"] for c in d["client"]]
          except Exception:
              pass
          if "com.arrowtile.puzzle" not in pk:
              print("::error title=GOOGLE_SERVICES_JSON paket adı yanlış::google-services.json içinde com.arrowtile.puzzle paket adı yok (bulunan: " + ", ".join(pk) + "). Firebase projesine Android uygulamasını com.arrowtile.puzzle paket adıyla ekleyip dosyayı yeniden indirin.")
              sys.exit(1)
          ' || exit 1
          case "$KEY_PASS$KS_PASS$KEY_ALIAS" in *\\*) echo "::error::Şifre/alias içinde ters eğik çizgi (\\) olmamalı (key.properties bozulur)."; exit 1;; esac

      - name: Play yükleme ön denetimi (isteğe bağlı secret)
        id: play
        working-directory: ${{ github.workspace }}
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: |
          # Girdiler yalnızca env üzerinden okunur (komut enjeksiyonu yok); secret değeri günlüğe yazılmaz.
          upload=false; internal=false; alpha=false
          case "$TRACK" in
            none|"") echo "Play yüklemesi istenmedi (track=none); yalnızca AAB artifact üretilecek." ;;
            internal|alpha|internal+alpha)
              if [ -z "$PLAY_SA_JSON" ]; then
                echo "::warning title=Play yüklemesi atlandı::PLAY_SERVICE_ACCOUNT_JSON secret'ı tanımlı değil; AAB Play'e yüklenmeyecek, yalnızca artifact olarak üretilecek. Kurulum: docs/25-play-otomatik-yukleme.md"
              else
                printf '%s' "$PLAY_SA_JSON" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("::error title=PLAY_SERVICE_ACCOUNT_JSON geçersiz::PLAY_SERVICE_ACCOUNT_JSON geçerli bir JSON değil. Google Cloud Console - Service accounts - Keys - Add key - JSON ile indirdiğiniz dosyanın TÜM içeriğini ({ ile başlayıp } ile biten) olduğu gibi yapıştırın. Adımlar: docs/25-play-otomatik-yukleme.md.")
              sys.exit(1)
          if not isinstance(d, dict) or d.get("type") != "service_account" or not d.get("client_email") or not d.get("private_key"):
              print("::error title=PLAY_SERVICE_ACCOUNT_JSON servis hesabı anahtarı değil::JSON içinde type=service_account, client_email ve private_key alanları olmalı. OAuth istemci dosyası ya da google-services.json yapıştırılmış olabilir. Adımlar: docs/25-play-otomatik-yukleme.md.")
              sys.exit(1)
          ' || exit 1
                upload=true
                case "$TRACK" in internal|internal+alpha) internal=true;; esac
                case "$TRACK" in alpha|internal+alpha) alpha=true;; esac
              fi ;;
            *) echo "::error::Bilinmeyen track değeri."; exit 1 ;;
          esac
          {
            echo "upload=$upload"
            echo "internal=$internal"
            echo "alpha=$alpha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version

      - name: Play sürüm notlarını hazırla (whatsnew)
        id: notes_dir
        if: steps.play.outputs.upload == 'true'
        working-directory: ${{ github.workspace }}
        env:
          NOTES_TR: ${{ inputs.release_notes_tr }}
          NOTES_EN: ${{ inputs.release_notes_en }}
          NOTES_DE: ${{ inputs.release_notes_de }}
          NOTES_AR: ${{ inputs.release_notes_ar }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'whatsnew'
          out.mkdir(parents=True, exist_ok=True)
          src = pathlib.Path('flutter/arrowtile/release-notes')
          found = 0
          for lang, loc in (('tr', 'tr-TR'), ('en', 'en-US'), ('de', 'de-DE'), ('ar', 'ar')):
              text = os.environ.get('NOTES_' + lang.upper(), '').replace('\\n', '\n').strip()
              origin = 'girdi'
              if not text:
                  f = src / (lang + '.txt')
                  origin = str(f)
                  text = f.read_text(encoding='utf-8').strip() if f.is_file() else ''
              if not text:
                  print(f"::warning title=Sürüm notu yok ({loc})::{loc} için girdi de {src}/{lang}.txt de boş; bu dilde sürüm notu gönderilmeyecek.")
                  continue
              if len(text) > 500:
                  raise SystemExit(f"::error title=Sürüm notu çok uzun ({loc})::{loc} sürüm notu {len(text)} karakter; Play en çok 500 kabul eder ({origin}).")
              (out / ('whatsnew-' + loc)).write_text(text + '\n', encoding='utf-8')
              found += 1
              print(f"{loc}: {len(text)} karakter ({origin})")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as g:
              g.write('dir=' + (str(out) if found else '') + '\n')
          PY

      - name: Anahtar deposu ve key.properties oluştur
        working-directory: ${{ github.workspace }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 çözülemedi veya boş."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::Anahtar deposu açılamadı: depo şifresi veya alias yanlış (ya da base64 bozuk)."; exit 1; }
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > flutter/arrowtile/android/key.properties

      - name: AdMob kimliklerini yerleştir (yalnızca derleme çalışma kopyasında)
        run: |
          python3 - <<'PY'
          import os, re
          def sub(path, pattern, repl, label):
              s = open(path, encoding='utf-8').read()
              n, c = re.subn(pattern, lambda m: m.group(1) + repl + m.group(2), s)
              if c != 1:
                  raise SystemExit(f"::error::{label} bulunamadı ({path}); kaynak biçimi değişmiş olabilir.")
              open(path, 'w', encoding='utf-8').write(n)
          sub('android/app/src/main/res/values/ads.xml',
              r'(<string name="admob_app_id" translatable="false">)[^<]*(</string>)',
              os.environ['ADMOB_APP_ID'], 'admob_app_id')
          sub('lib/config/ads_config.dart',
              r"(static const String releaseInterstitialId = ')[^']*(';)",
              os.environ['ADMOB_INTERSTITIAL_ID'], 'releaseInterstitialId')
          sub('lib/config/ads_config.dart',
              r"(static const String releaseRewardedId = ')[^']*(';)",
              os.environ['ADMOB_REWARDED_ID'], 'releaseRewardedId')
          sub('lib/config/ads_config.dart',
              r"(static const String releaseBannerId = ')[^']*(';)",
              os.environ['ADMOB_BANNER_ID'], 'releaseBannerId')
          PY

      - name: Firebase yapılandırmasını yaz (yalnızca derleme çalışma kopyasında; depoya girmez)
        working-directory: ${{ github.workspace }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > flutter/arrowtile/android/app/google-services.json
          test -s flutter/arrowtile/android/app/google-services.json || { echo "::error::GOOGLE_SERVICES_JSON yazılamadı veya boş."; exit 1; }

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build appbundle --release

      - name: İmzayı doğrula (debug anahtarı olmamalı)
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          OUT=$(keytool -printcert -jarfile "$AAB" 2>&1 || true)
          echo "$OUT" | grep -E "Owner:|SHA256:|Valid from" | sed 's/^/  /'
          if echo "$OUT" | grep -qi "Android Debug"; then echo "::error::AAB debug anahtarıyla imzalanmış."; exit 1; fi
          echo "$OUT" | grep -q "Owner:" || { echo "::error::AAB imzası okunamadı."; exit 1; }

      - name: Anahtar dosyalarını sil
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" flutter/arrowtile/android/key.properties flutter/arrowtile/android/app/google-services.json

      # Play'e doğrudan yükleme açıksa artifact kotası dolu olsa bile (Artifact storage quota) yükleme sürsün.
      - uses: actions/upload-artifact@v5
        continue-on-error: ${{ steps.play.outputs.upload == 'true' }}
        with:
          name: arrowtile-release-aab
          path: flutter/arrowtile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # ---- İsteğe bağlı: Google Play'e doğrudan yükleme (docs/25). AAB artifact'ı yukarıda zaten yüklendi; bu adımlar başarısız olsa bile AAB elde kalır.
      - name: Eşleme (mapping) dosyası var mı?
        id: mapping
        if: steps.play.outputs.upload == 'true'
        run: |
          M=build/app/outputs/mapping/release/mapping.txt
          if [ -s "$M" ]; then echo "file=flutter/arrowtile/$M" >> "$GITHUB_OUTPUT"; else echo "file=" >> "$GITHUB_OUTPUT"; fi

      - name: Play - iç test (internal)
        if: steps.play.outputs.internal == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arrowtile.puzzle
          releaseFiles: flutter/arrowtile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.status }}
          whatsNewDirectory: ${{ steps.notes_dir.outputs.dir }}
          mappingFile: ${{ steps.mapping.outputs.file }}

      - name: Play - kapalı test (alpha)
        if: steps.play.outputs.alpha == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arrowtile.puzzle
          releaseFiles: flutter/arrowtile/build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: ${{ inputs.status }}
          changesNotSentForReview: ${{ inputs.hold_for_review }}
          whatsNewDirectory: ${{ steps.notes_dir.outputs.dir }}
          mappingFile: ${{ steps.mapping.outputs.file }}
