name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-preview:
    name: Web önizleme doğrulamaları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node tools/validate-levels.js
      - run: node tools/validate-i18n.js
      - run: node tools/test-ads.js
      - run: node tools/test-daily.js
      - run: node tools/flutter/check-arb.js

  flutter:
    name: Flutter analiz, test ve deneme APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/arrowtile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      # Deneme APK: yayın modunda derlenir (R8 dahil), imza anahtarı yoksa debug anahtarıyla imzalanır.
      # Play Store'a YÜKLENEMEZ; yalnızca telefonda denemek içindir.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Arrowtile-deneme.apk
      - uses: actions/upload-artifact@v5
        with:
          name: arrowtile-deneme-apk
          path: flutter/arrowtile/Arrowtile-deneme.apk
          retention-days: 14
      # main'e her gönderimde "Deneme APK" sürümü güncellenir: telefondan Releases sayfasından doğrudan indirilir.
      - name: Deneme APK sürümünü güncelle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Telefonda denemek için otomatik derlenen APK (commit ${GITHUB_SHA::7}). Play Store'a yüklenmez; reklamlar test reklamıdır, satın alma çalışmaz."
          if gh release view deneme-apk >/dev/null 2>&1; then
            gh release upload deneme-apk Arrowtile-deneme.apk --clobber
            gh release edit deneme-apk --notes "$NOTES" --prerelease
          else
            gh release create deneme-apk Arrowtile-deneme.apk --title "Deneme APK" --notes "$NOTES" --prerelease --target main
          fi

  smoke:
    name: Emülatörde açılış testi
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: arrowtile-deneme-apk
      - name: KVM izni
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK'yı emülatörde aç ve çökme kaydını topla
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Arrowtile-deneme.apk
            adb logcat -c
            adb shell monkey -p com.arrowtile.puzzle -c android.intent.category.LAUNCHER 1
            sleep 40
            adb shell pidof com.arrowtile.puzzle > pid.txt || true
            adb logcat -d -v brief AndroidRuntime:E flutter:V Ads:V DEBUG:V libc:F ActivityManager:W '*:S' > logcat.txt || true
            grep -iE "Ad failed to load|onAdFailedToLoad|rewarded|interstitial" logcat.txt > ads-logcat.txt || true
            adb exec-out screencap -p > screen.png || true
            echo "=== PID: $(cat pid.txt) ==="
            cat logcat.txt | tail -200
            echo "=== REKLAM SATIRLARI (Ad failed to load / onAdFailedToLoad / rewarded / interstitial) ==="
            if [ -s ads-logcat.txt ]; then cat ads-logcat.txt; else echo "(reklam satırı yok)"; fi
            echo "=== REKLAM SATIRLARI SONU (yükleme hatası işi başarısız yapmaz) ==="
            if grep -q "FATAL EXCEPTION" logcat.txt && grep -q "Process: com.arrowtile.puzzle" logcat.txt; then echo "UYGULAMA ÇÖKTÜ"; exit 1; fi
            test -s pid.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            ads-logcat.txt
            screen.png
