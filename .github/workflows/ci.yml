name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-preview:
    name: Web önizleme doğrulamaları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node tools/validate-levels.js
      - run: node tools/validate-i18n.js
      - run: node tools/test-ads.js
      - run: node tools/test-daily.js
      - run: node tools/verify-5000.js --no-write
      - run: node tools/flutter/check-arb.js
      - run: node tools/gen-tokens.js --check
      - run: node tools/contrast.js

  flutter:
    name: Flutter analiz, test ve deneme APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/arrowtile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      # Deneme APK: yayın modunda derlenir (R8 dahil), imza anahtarı yoksa debug anahtarıyla imzalanır.
      # Play Store'a YÜKLENEMEZ; yalnızca telefonda denemek içindir.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Arrowtile-deneme.apk
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        with:
          name: arrowtile-deneme-apk
          path: flutter/arrowtile/Arrowtile-deneme.apk
          retention-days: 3
      # main'e her gönderimde "Deneme APK" sürümü güncellenir: telefondan Releases sayfasından doğrudan indirilir.
      - name: Deneme APK sürümünü güncelle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Telefonda denemek için otomatik derlenen APK (commit ${GITHUB_SHA::7}). Play Store'a yüklenmez; reklamlar test reklamıdır, satın alma çalışmaz."
          if gh release view deneme-apk >/dev/null 2>&1; then
            gh release upload deneme-apk Arrowtile-deneme.apk --clobber
            gh release edit deneme-apk --notes "$NOTES" --prerelease
          else
            gh release create deneme-apk Arrowtile-deneme.apk --title "Deneme APK" --notes "$NOTES" --prerelease --target main
          fi

  # Debug derleme + UMP "EEA" hata ayıklama coğrafyası (--dart-define=UMP_DEBUG_EEA=true): Avrupa'daki test kullanıcısının
  # yolunu (onay formu) emülatörde canlandırmak içindir. Bu APK asla dağıtılmaz; yalnızca smoke-eea işi kullanır.
  debug-eea-apk:
    name: Debug APK (UMP EEA hata ayıklama)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/arrowtile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug --dart-define=UMP_DEBUG_EEA=true
      - run: cp build/app/outputs/flutter-apk/app-debug.apk Arrowtile-debug-eea.apk
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        with:
          name: arrowtile-debug-eea-apk
          path: flutter/arrowtile/Arrowtile-debug-eea.apk
          retention-days: 1

  smoke:
    name: Emülatörde açılış ve geri dönüş testi
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: arrowtile-deneme-apk
      - name: KVM izni
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK'yı emülatörde aç, çökme kaydını topla, arka plana gidip dönme testini yap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Arrowtile-deneme.apk
            adb logcat -c
            adb shell monkey -p com.arrowtile.puzzle -c android.intent.category.LAUNCHER 1
            sleep 40
            adb shell pidof com.arrowtile.puzzle > pid.txt || true
            adb logcat -d -v brief AndroidRuntime:E flutter:V Ads:V DEBUG:V libc:F ActivityManager:W '*:S' > logcat.txt || true
            grep -iE "Ad failed to load|onAdFailedToLoad|rewarded|interstitial" logcat.txt > ads-logcat.txt || true
            adb exec-out screencap -p > screen.png || true
            echo "=== PID: $(cat pid.txt) ==="
            cat logcat.txt | tail -200
            echo "=== REKLAM SATIRLARI (Ad failed to load / onAdFailedToLoad / rewarded / interstitial) ==="
            if [ -s ads-logcat.txt ]; then cat ads-logcat.txt; else echo "(reklam satırı yok)"; fi
            echo "=== REKLAM SATIRLARI SONU (yükleme hatası işi başarısız yapmaz) ==="
            if grep -q "FATAL EXCEPTION" logcat.txt && grep -q "Process: com.arrowtile.puzzle" logcat.txt; then echo "UYGULAMA ÇÖKTÜ"; exit 1; fi
            test -s pid.txt
            bash .github/scripts/smoke-resume.sh release 0
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        if: always()
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            ads-logcat.txt
            screen.png
            smoke-release/

  # EEA (Avrupa) yolu: UMP onay formu gösterilir; ardından aynı arka plana gidip dönme testi.
  smoke-eea:
    name: Emülatörde EEA onay formu + geri dönüş testi
    needs: debug-eea-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: arrowtile-debug-eea-apk
      - name: KVM izni
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Debug APK (EEA coğrafyası) ile geri dönüş testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Arrowtile-debug-eea.apk
            bash .github/scripts/smoke-resume.sh eea 1
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        if: always()
        with:
          name: emulator-eea
          path: smoke-eea/

  # docs/18 (1.1.1): "17. seviye açılmadı / reklam donuyor" için emülatör testi. Debug APK, AUTOPLAY_FROM=13 ile seviye 13'ten
  # kendiliğinden oynar ve geçiş reklamı denemelerinden (15/16 → 17 dahil) geçip seviye 18'e ulaşmalıdır.
  #   nofill: geçersiz reklam birimi (doldurulamadı; onaysız AdMob hesabını taklit eder)  |  fill: Google test reklamları (gerçek gösterim)
  #   slow (1.1.4): fill + show() 8 sn gecikmeli; sonraki seviye reklam kapanmadan açılırsa / seviye sırasında AdActivity görülürse başarısız
  debug-ads-apk:
    name: Debug APK (reklam donma testi, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nofill
            defines: --dart-define=ADS_FORCE_INVALID=true --dart-define=AUTOPLAY_FROM=13
          - variant: fill
            defines: --dart-define=AUTOPLAY_FROM=13
          # 1.1.4 (docs/21): gerçek cihazdaki yavaş sunum — show() 8 sn geciktirilir; seviye sonu reklam kapanana dek beklemeli
          - variant: slow
            defines: --dart-define=AUTOPLAY_FROM=13 --dart-define=ADS_PRESENT_DELAY_MS=8000
    defaults:
      run:
        working-directory: flutter/arrowtile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug ${{ matrix.defines }}
      - run: cp build/app/outputs/flutter-apk/app-debug.apk Arrowtile-debug-ads-${{ matrix.variant }}.apk
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        with:
          name: arrowtile-debug-ads-${{ matrix.variant }}-apk
          path: flutter/arrowtile/Arrowtile-debug-ads-${{ matrix.variant }}.apk
          retention-days: 1

  smoke-ads:
    name: Emülatörde reklam donma testi (${{ matrix.variant }})
    needs: debug-ads-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [nofill, fill, slow]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: arrowtile-debug-ads-${{ matrix.variant }}-apk
      - name: KVM izni
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Seviye 13'ten 18'e otomatik oyna, geçiş reklamı denemelerinde donma olmamalı
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Arrowtile-debug-ads-${{ matrix.variant }}.apk
            bash .github/scripts/smoke-ads.sh ads-${{ matrix.variant }} ${{ matrix.variant }}
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        if: always()
        with:
          name: emulator-ads-${{ matrix.variant }}
          path: smoke-ads-${{ matrix.variant }}/

  # docs/19 (1.1.2): Firebase Gradle eklentileri (google-services + crashlytics) yalnızca google-services.json varsa uygulanır. Normal
  # CI derlemelerinde dosya yoktur (eklentiler hiç çalışmaz). Bu iş, GERÇEK release.yml yolunu SAHTE bir yapılandırmayla dener:
  # eklentiler AGP 9 + R8 ile derleniyor mu, Firebase başlatılıyor mu, onay sinyalleri hesaplanıyor mu. Gerçek kimlik YOKTUR;
  # sahte proje yalnızca bu işin çalışma kopyasında yazılır ve depoya girmez. Bu APK asla dağıtılmaz.
  firebase-apk:
    name: Release APK (sahte Firebase yapılandırmasıyla eklenti denemesi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/arrowtile
    env:
      ORG_GRADLE_PROJECT_arrowtileSkipMappingUpload: "true" # sahte uygulama kimliğine eşleme dosyası yüklenmesin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sahte google-services.json yaz (gerçek değil; depoya girmez)
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123456789012", "project_id": "arrowtile-ci-dummy", "storage_bucket": "arrowtile-ci-dummy.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef", "android_client_info": {"package_name": "com.arrowtile.puzzle"}},
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyA0000000000000000000000000000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
          python3 -c "import json; json.load(open('android/app/google-services.json'))"
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Arrowtile-firebase-ci.apk
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        with:
          name: arrowtile-firebase-ci-apk
          path: flutter/arrowtile/Arrowtile-firebase-ci.apk
          retention-days: 1

  smoke-firebase:
    name: Emülatörde Firebase başlatma + onay sinyali + geri dönüş testi
    needs: firebase-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: arrowtile-firebase-ci-apk
      - name: KVM izni
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Firebase etkin APK ile açılış, günlük satırları ve geri dönüş testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Arrowtile-firebase-ci.apk
            bash .github/scripts/smoke-firebase.sh
      - uses: actions/upload-artifact@v5
        continue-on-error: true # 1.2.1: artifact depolama kotası dolunca yalnızca yükleme düşmesin (docs/27 §D)
        if: always()
        with:
          name: emulator-firebase
          path: |
            logcat-fb.txt
            smoke-firebase/
